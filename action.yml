# usd-asset-gate composite action.
#
# Runs OpenUSD's validators and your house rules on the USD files a pull request
# changed. It uses no other actions — only bash and pip — so pinning this action by
# commit SHA pins everything it runs. It expects the repository to be checked out
# with enough history to reach the pull request's base commit (fetch-depth: 0, or
# the plain-git checkout shown in the README).
name: usd-asset-gate
description: CI quality gate for OpenUSD assets — upstream validators, house rules, annotations, job summary and one PR comment.
author: Daniel McCoy Stephenson
branding:
  icon: box
  color: blue

inputs:
  config:
    description: Config file path. Default is .usd-asset-gate.yml when present.
    required: false
    default: ""
  usd-core-version:
    description: usd-core version to install from PyPI.
    required: false
    default: "26.8"
  paths:
    description: Space-separated files or directories to check. With a pull request, they narrow the changed files; without one, they are checked in full. Default is the changed files, or the whole repository outside a pull request.
    required: false
    default: ""
  comment:
    description: Create or update the single PR comment ("true" or "false").
    required: false
    default: "true"
  fail-on:
    description: Lowest severity that fails the check (error, warning, info, never). Default comes from the config, else error.
    required: false
    default: ""
  base-sha:
    description: Base commit for changed-file discovery. Default is the pull request's base SHA.
    required: false
    default: ""
  github-token:
    description: Token for fetching the base commit and writing the PR comment.
    required: false
    default: ${{ github.token }}
  preview:
    description: 'Advisory visual diffs (RFC 0028). "auto" renders the changed files before and after with Strata when the config sets `preview.enabled: true`, adding "Visual changes" to the job summary and the PR comment; "false" turns it off. Never changes the exit code. Needs EGL and a Mesa driver on the runner (libegl1 libegl-mesa0 libgl1-mesa-dri), else it reports "preview unavailable".'
    required: false
    default: "auto"
  strata-version:
    description: Strata release whose libstrata-<version>-linux-x64.so the preview downloads.
    required: false
    default: "0.6.0"
  strata-sha256:
    description: SHA-256 of that library, from the release's SHA256SUMS.
    required: false
    default: "3815068f90afa67b42177359a7ea918a5de321d7f7bad8706fa5275c4906af2a"

runs:
  using: composite
  steps:
    - name: USD asset gate
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha }}
        USD_ASSET_GATE_PATHS: ${{ inputs.paths }}
        USD_ASSET_GATE_CONFIG: ${{ inputs.config }}
        USD_ASSET_GATE_FAIL_ON: ${{ inputs.fail-on }}
        USD_ASSET_GATE_COMMENT: ${{ inputs.comment }}
        USD_CORE_VERSION: ${{ inputs.usd-core-version }}
        USD_ASSET_GATE_SPEC: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        USD_ASSET_GATE_PREVIEW: ${{ inputs.preview }}
        STRATA_VERSION: ${{ inputs.strata-version }}
        STRATA_SHA256: ${{ inputs.strata-sha256 }}
      run: bash "$GITHUB_ACTION_PATH/ci/usd-asset-gate.sh"
