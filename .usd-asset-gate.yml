# usd-asset-gate's own configuration: this repository dogfoods the gate on its
# expected-pass fixtures. The expected-fail fixtures are covered by pytest and by the
# dogfood workflow, which checks them with their own configs.
version: 1

include: ["tests/fixtures/pass/**"]
fail_on: warning

rules:
  stage-metadata:
    metersPerUnit: 1
    upAxis: "Y"
  default-prim:
    kind: model
  file-size:
    max_bytes: { default: 1MB }
  prim-budget:
    max_prims: 1000
  instance-budget:
    max_prototypes: 10
  prim-naming:
    patterns:
      - match: { type: Material }
        regex: "^M_[A-Za-z0-9_]+$"
      - match: { type: "*" }
        regex: "^[A-Z][A-Za-z0-9_]*$"
