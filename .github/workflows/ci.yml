# Tests for usd-asset-gate itself.
#
# Like the gate it tests, this workflow uses no `uses:` lines at all: the checkout
# is plain git and Python versions come from `uv`, installed with pip.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }}, usd-core ${{ matrix.usd-core }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        usd-core: ["25.8", "26.8"]
    steps:
      - name: Checkout (plain git)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"

      - name: Set up Python ${{ matrix.python }}
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install -q "uv==0.11.16"
          "$RUNNER_TEMP/uv/bin/uv" venv -q --seed --python "${{ matrix.python }}" .venv
          .venv/bin/python --version

      - name: Install (pip install .)
        run: |
          .venv/bin/python -m pip install -q "usd-core==${{ matrix.usd-core }}" ".[test]"
          .venv/bin/python -c "from pxr import Usd; print('OpenUSD', Usd.GetVersion())"

      - name: Smoke test the installed command
        run: |
          .venv/bin/usd-asset-gate --help
          .venv/bin/usd-asset-gate check tests/fixtures/pass

      - name: Run tests
        run: .venv/bin/python -m pytest -ra

  # RFC 0028: the advisory Strata preview, rendered for real on Mesa llvmpipe. Strata comes
  # from its GitHub release tarball (the library and strata-imgcmp), pinned by SHA-256
  # (no `uses:`, no container).
  # A workflow artifact cannot be uploaded from a plain `run:` step (the artifact service
  # token is only given to actions), so the images stay on the runner and the job summary
  # carries the "Visual changes" section and the numbers.
  preview:
    name: preview (Strata headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STRATA_VERSION: "0.6.0"
      STRATA_TGZ_SHA256: "4fea4eaaefcc35e122b66a70cf5559c1dfa3ba57eff966f9dd5da2f49cba9499"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Checkout (plain git)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach "${GITHUB_SHA}"

      - name: Set up Python 3.12
        run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install -q "uv==0.11.16"
          "$RUNNER_TEMP/uv/bin/uv" venv -q --seed --python 3.12 .venv

      - name: Install (pip install .[test,preview])
        run: .venv/bin/python -m pip install -q "usd-core==26.8" ".[test,preview]"

      - name: Install Strata and Mesa (EGL + llvmpipe)
        run: |
          mkdir -p "$RUNNER_TEMP/strata"
          tgz="$RUNNER_TEMP/strata-${STRATA_VERSION}-linux-x64.tar.gz"
          curl -fsSL -o "$tgz" \
            "https://github.com/Preponderous-Software/strata/releases/download/v${STRATA_VERSION}/strata-${STRATA_VERSION}-linux-x64.tar.gz"
          echo "${STRATA_TGZ_SHA256}  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP/strata"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
          echo "STRATA_LIBRARY=$RUNNER_TEMP/strata/lib/libstrata.so" >> "$GITHUB_ENV"
          echo "STRATA_IMGCMP=$RUNNER_TEMP/strata/bin/strata-imgcmp" >> "$GITHUB_ENV"

      - name: Render tests (Strata required; ΔE cross-checked against strata-imgcmp)
        env:
          USD_ASSET_GATE_REQUIRE_STRATA: "1"
        run: .venv/bin/python -m pytest -ra -v tests/test_preview_render.py tests/test_preview.py

      - name: Preview a real fixture change (into the job summary)
        run: .venv/bin/python docs/capture_preview.py "$RUNNER_TEMP/previews"

      - name: Show the previews document
        run: cat "$RUNNER_TEMP/previews/previews.json"

      # The consumer path: ci/usd-asset-gate.sh on a throwaway repository with one fixture
      # change, downloading the pinned Strata itself. The preview must not change the exit code.
      - name: The copy-in script renders previews (end to end, advisory)
        run: |
          demo="$RUNNER_TEMP/script-demo"
          mkdir -p "$demo" "$RUNNER_TEMP/script-work"
          cp -r tests/fixtures/pass "$demo/assets"
          rm -f "$demo"/assets/*.usdc "$demo"/assets/*.usdz
          printf 'version: 2\ninclude: ["assets/**"]\nfail_on: never\npreview:\n  enabled: true\n' > "$demo/.usd-asset-gate.yml"
          git -C "$demo" init -q
          git -C "$demo" -c user.email=ci@example.com -c user.name=ci add .
          git -C "$demo" -c user.email=ci@example.com -c user.name=ci commit -qm base
          sed -i 's/double3 xformOp:translate = (2, 0, 0)/double3 xformOp:translate = (2, 0, 0.8)/' "$demo/assets/yard.usda"
          git -C "$demo" -c user.email=ci@example.com -c user.name=ci commit -qam "move CrateB"
          set +e
          (cd "$demo" && env -u STRATA_LIBRARY BASE_SHA="$(git rev-parse HEAD~1)" USD_ASSET_GATE_SPEC="$GITHUB_WORKSPACE" \
            USD_ASSET_GATE_COMMENT=false RUNNER_TEMP="$RUNNER_TEMP/script-work" bash "$GITHUB_WORKSPACE/ci/usd-asset-gate.sh")
          status=$?
          set -e
          echo "script exit code: $status"
          test "$status" -eq 0
          .venv/bin/python - "$RUNNER_TEMP/script-work/usd-asset-gate-previews.json" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          assert doc["status"] == "ok", doc
          (entry,) = doc["files"]
          assert entry["path"].endswith("yard.usda") and entry["visible_change"], entry
          print("script previews:", entry["path"], [round(v["fraction_over"], 4) for v in entry["views"]])
          PY
