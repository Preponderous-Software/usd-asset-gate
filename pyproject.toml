[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usd-asset-gate"
version = "0.1.0"
description = "CI quality gate for OpenUSD assets: upstream validators, house rules and pull-request reporting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel McCoy Stephenson" }]
requires-python = ">=3.10"
dependencies = [
    "usd-core>=25.8",
    "PyYAML>=6.0",
]
keywords = ["openusd", "usd", "validation", "ci", "github-actions", "quality-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
usd-asset-gate = "usd_asset_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Preponderous-Software/usd-asset-gate"
Issues = "https://github.com/Preponderous-Software/usd-asset-gate/issues"

[tool.setuptools.packages.find]
include = ["usd_asset_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
